<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Journal d'activité</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/elecpay/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div data-theme="light" style="min-height: 960px; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--ink); font-family: var(--font-admin);">
<div style="flex: 1 1 232px; display: flex;"><dc-import name="Menu" active="journal" hint-size="232px,960px"></dc-import></div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 18px;">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
<div><h1 style="margin: 0; font: 600 24px/32px var(--font-admin);">Journal d'activité</h1><p style="margin: 2px 0 0; font: 400 13px/20px var(--font-admin); color: var(--ink-muted);">Toutes les actions sensibles de l'équipe et du système. Ce journal ne peut être ni modifié ni supprimé.</p></div>
<button style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink); font: 500 14px/20px var(--font-admin); cursor: pointer;">Exporter la période</button>
</header>

<div role="tablist" aria-label="Filtrer par type d'action" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="5"><button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for>
</div>

<section style="border-radius: 14px; background: var(--surface-1); border: 1px solid var(--line); overflow: hidden;">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<div style="border-bottom: 1px solid var(--line);">
<button onClick="{{r.toggle}}" aria-expanded="{{r.openStr}}" style="display: flex; flex-wrap: wrap; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 18px; border: none; background: transparent; cursor: pointer; text-align: left; font-family: var(--font-admin); color: var(--ink);">
<span style="width: 92px; flex: none; font: 400 12px/18px var(--font-admin); color: var(--ink-muted); font-variant-numeric: tabular-nums;">{{r.when}}</span>
<span style="{{r.typeStyle}}">{{r.type}}</span>
<span style="flex: 1 1 320px; min-width: 0; font: 400 13px/20px var(--font-admin);"><strong style="font-weight: 600;">{{r.actor}}</strong> <span style="color: var(--ink-muted);">{{r.role}}</span> · {{r.action}} <span style="font-family: var(--font-mono); font-size: 12px;">{{r.target}}</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="{{r.chev}}"><path d="M6 9l6 6 6-6"></path></svg>
</button>
<sc-if value="{{r.open}}" hint-placeholder-val="{{false}}">
<div style="padding: 0 18px 14px 122px; display: flex; flex-wrap: wrap; gap: 10px;">
<div style="flex: 1 1 220px; padding: 10px 12px; border-radius: 10px; background: var(--error-soft);"><span style="display: block; font: 600 11px/14px var(--font-admin); letter-spacing: 0.06em; text-transform: uppercase; color: var(--error-text);">Avant</span><span style="font: 500 12px/18px var(--font-mono); white-space: pre-line;">{{r.before}}</span></div>
<div style="flex: 1 1 220px; padding: 10px 12px; border-radius: 10px; background: var(--success-soft);"><span style="display: block; font: 600 11px/14px var(--font-admin); letter-spacing: 0.06em; text-transform: uppercase; color: var(--success);">Après</span><span style="font: 500 12px/18px var(--font-mono); white-space: pre-line;">{{r.after}}</span></div>
<div style="flex: 1 1 100%; font: 400 12px/16px var(--font-admin); color: var(--ink-muted);">{{r.meta}}</div>
</div>
</sc-if>
</div>
</sc-for>
</section>
<span style="font: 400 13px/20px var(--font-admin); color: var(--ink-muted);">Durée de conservation du journal : [à définir avec la loi congolaise sur la protection des données].</span>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { f: 'tout', open: 'a1' }; }
  renderVals() {
    const L = [
      { id: 'a1', when: "Auj. 14:40", cat: 'transaction', type: 'Transaction', actor: 'Christelle Mabiala', role: '(Admin)', action: 'a relancé la vérification de', target: 'TX-2026-004815', before: 'statut : en_attente', after: 'statut : en_attente\nréponse opérateur : en cours de traitement', meta: 'Adresse IP 41.202.xx.xx · navigateur Chrome · aucune modification de statut par l’équipe' },
      { id: 'a2', when: "Auj. 11:02", cat: 'compte', type: 'Consultation', actor: 'Patrick Moukala', role: '(Support)', action: 'a consulté le dossier de', target: 'USR-000391 · Junior Ibara', before: '—', after: 'lecture seule : profil, factures, transactions', meta: 'Les consultations de dossiers clients sont tracées.' },
      { id: 'a3', when: "Auj. 09:15", cat: 'facture', type: 'Facture', actor: 'Christelle Mabiala', role: '(Admin)', action: 'a annulé', target: 'FAC-2026-10-003871', before: 'statut : a_payer\nmontant : 5 920 FCFA', after: 'statut : annulee\nmotif : facture en double', meta: 'Client prévenu par notification à 09:15.' },
      { id: 'a4', when: "Hier 16:55", cat: 'parametre', type: 'Rôle', actor: 'Serge Bouanga', role: '(Super admin)', action: 'a changé le rôle de', target: 'Patrick Moukala', before: 'rôle : aucun (nouveau membre)', after: 'rôle : support', meta: 'Seul un Super admin peut attribuer un rôle.' },
      { id: 'a5', when: "Hier 10:20", cat: 'parametre', type: 'Paramètre', actor: 'Serge Bouanga', role: '(Super admin)', action: 'a modifié le seuil', target: 'alerte consommation inhabituelle', before: 'seuil : 25 %', after: 'seuil : 30 %', meta: 'Effet à partir des relevés du lendemain.' },
      { id: 'a6', when: '8 nov. 10:05', cat: 'compte', type: 'Compte', actor: 'Christelle Mabiala', role: '(Admin)', action: 'a désactivé le compte de', target: 'Bienvenu Nkounkou', before: 'statut : actif\nsessions : 1', after: 'statut : desactive\nsessions : 0\nmotif : demande du titulaire', meta: 'Factures et historique conservés.' },
      { id: 'a7', when: '5 nov. 06:10', cat: 'facture', type: 'Système', actor: 'Système', role: '', action: 'a généré les factures d’octobre 2026', target: '1 380 factures', before: '—', after: '1 380 factures · 15 862 400 FCFA\ntarif TRF-2026-01', meta: 'Tâche planifiée mensuelle, à partir des relevés vérifiés.' }
    ];
    const C = { transaction: 'var(--warning-soft); color: var(--warning)', compte: 'var(--current-soft); color: var(--current-text)', facture: 'var(--surface-2); color: var(--ink)', parametre: 'var(--volt-soft); color: var(--volt-text)' };
    const s = this.state;
    const F = [['tout', 'Tout'], ['facture', 'Factures'], ['transaction', 'Transactions'], ['compte', 'Comptes'], ['parametre', 'Rôles et paramètres']];
    const chips = F.map((c) => {
      const on = c[0] === s.f;
      return { label: c[1], on: on ? 'true' : 'false', pick: () => this.setState({ f: c[0] }),
        style: 'min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font: 500 13px/20px var(--font-admin); color: var(--ink); border: 1px solid ' + (on ? 'var(--volt)' : 'var(--line)') + '; background: ' + (on ? 'var(--volt-soft)' : 'var(--surface-1)') + ';' };
    });
    const rows = L.filter((r) => s.f === 'tout' || r.cat === s.f).map((r) => {
      const open = s.open === r.id;
      return Object.assign({}, r, {
        open, openStr: open ? 'true' : 'false',
        toggle: () => this.setState({ open: open ? '' : r.id }),
        typeStyle: 'flex: none; min-width: 92px; box-sizing: border-box; display: inline-flex; justify-content: center; height: 22px; align-items: center; padding: 0 8px; border-radius: 6px; font: 600 11px/14px var(--font-admin); background: ' + C[r.cat] + ';',
        chev: 'flex: none; transition: transform 150ms ease-out; transform: rotate(' + (open ? '180' : '0') + 'deg);'
      });
    });
    return { chips, rows };
  }
}
</script>
</body>
</html>
