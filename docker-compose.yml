services:
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: elecpay
      MYSQL_USER: elecpay
      MYSQL_PASSWORD: elecpay
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3307:3306"   # 3307 pour ne pas entrer en conflit avec XAMPP
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
