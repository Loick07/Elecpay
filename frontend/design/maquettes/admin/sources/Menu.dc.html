<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Menu latéral</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/elecpay/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<aside data-theme="dark" style="width: 100%; min-height: 960px; height: 100%; box-sizing: border-box; padding: 20px 14px; background: var(--bg); color: var(--ink); font-family: var(--font-admin); display: flex; flex-direction: column; gap: 20px;">
<div style="display: flex; align-items: center; gap: 10px; padding: 0 8px;">
<span style="width: 32px; height: 32px; border-radius: 10px; background: var(--volt); color: var(--on-volt); display: grid; place-items: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
<span style="display: flex; flex-direction: column;"><span style="font: 700 15px/20px var(--font-admin);">ElecPay</span><span style="font: 500 11px/14px var(--font-admin); color: var(--ink-muted);">Back-office</span></span>
</div>
<nav aria-label="Menu" style="display: flex; flex-direction: column; gap: 2px;">
<sc-for list="{{items}}" as="it" hint-placeholder-count="8">
<a href="{{it.href}}" aria-current="{{it.current}}" style="{{it.style}}">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="{{it.iconColor}}" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{it.icon}}"></path></svg>
<span style="flex: 1;">{{it.label}}</span>
<span style="{{it.badgeStyle}}">{{it.badge}}</span>
</a>
</sc-for>
</nav>
<div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px; padding: 0 8px;">
<span style="align-self: flex-start; display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 999px; border: 1px dashed var(--current-text); color: var(--current-text); font: 600 10px/14px var(--font-admin); letter-spacing: 0.06em; text-transform: uppercase;">Mode démo</span>
<div style="display: flex; align-items: center; gap: 10px;"><span style="width: 32px; height: 32px; border-radius: 999px; background: var(--current-soft); color: var(--current-text); display: grid; place-items: center; font: 600 12px/16px var(--font-admin);">CM</span><span style="display: flex; flex-direction: column;"><span style="font: 500 13px/18px var(--font-admin);">Christelle Mabiala</span><span style="font: 400 12px/16px var(--font-admin); color: var(--ink-muted);">Admin</span></span></div>
</div>
</aside>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"active":{"editor":"enum","options":["dashboard","utilisateurs","compteurs","factures","transactions","notifications","journal","parametres"],"default":"dashboard"},"$preview":{"width":232,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const active = this.props.active ?? 'dashboard';
    const M = [
      ['dashboard', 'Tableau de bord', 'Main.dc.html', 'M3 3h7v9H3zM14 3h7v5h-7zM14 12h7v9h-7zM3 16h7v5H3z', ''],
      ['utilisateurs', 'Utilisateurs', 'Utilisateurs.dc.html', 'M9 12a4 4 0 100-8 4 4 0 000 8zM2 21a7 7 0 0114 0M16 4a4 4 0 010 8M22 21a7 7 0 00-4-6.3', ''],
      ['compteurs', 'Compteurs', 'Compteurs.dc.html', 'M6 3h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5a2 2 0 012-2zM8 8h8M8 12h3', '3'],
      ['factures', 'Factures', 'Factures.dc.html', 'M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8zM14 3v5h5M9 13h6M9 17h4', ''],
      ['transactions', 'Transactions', 'Transactions.dc.html', 'M7 7h13l-3-3M17 17H4l3 3', '4'],
      ['notifications', 'Notifications', 'Notifications.dc.html', 'M6 8a6 6 0 0112 0c0 7 3 9 3 9H3s3-2 3-9M10.3 21a1.9 1.9 0 003.4 0', ''],
      ['journal', 'Journal d’activité', 'Journal.dc.html', 'M4 4h16v16H4zM8 9h8M8 13h8M8 17h5', ''],
      ['parametres', 'Paramètres et rôles', 'Parametres.dc.html', 'M12 15a3 3 0 100-6 3 3 0 000 6zM12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1', '']
    ];
    const items = M.map((m) => {
      const on = m[0] === active;
      return {
        label: m[1], href: m[2], icon: m[3], badge: m[4],
        current: on ? 'page' : 'false',
        iconColor: on ? 'var(--volt)' : 'currentColor',
        style: 'display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 10px; border-radius: 10px; text-decoration: none; font: ' + (on ? '600' : '500') + ' 14px/20px var(--font-admin); color: ' + (on ? 'var(--ink)' : 'var(--ink-muted)') + ';' + (on ? ' background: rgba(245,166,35,0.14);' : ''),
        badgeStyle: m[4] ? 'min-width: 20px; height: 20px; padding: 0 6px; box-sizing: border-box; border-radius: 999px; background: var(--warning-soft); color: var(--warning); display: grid; place-items: center; font: 600 11px/14px var(--font-admin);' : 'display: none;'
      };
    });
    return { items };
  }
}
</script>
</body>
</html>
