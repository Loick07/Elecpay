# Intégration continue de l'application Flutter (client Android).
# Lancée seulement quand l'application change (ou la charte dont son thème est généré).
name: Mobile

on:
  push:
    branches: [main]
    paths:
      - "frontend/mobile/**"
      - "frontend/design/tokens.json" # le thème Flutter est généré depuis ce fichier
      - ".github/workflows/mobile.yml"
  pull_request:
    paths:
      - "frontend/mobile/**"
      - "frontend/design/tokens.json"
      - ".github/workflows/mobile.yml"
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

concurrency:
  group: mobile-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  analyze-test-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    defaults:
      run:
        working-directory: frontend/mobile

    steps:
      - uses: actions/checkout@v5

      # Gradle (construction Android) demande un JDK : le même que sur le PC de développement.
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
          cache-dependency-path: |
            frontend/mobile/android/*.gradle*
            frontend/mobile/android/gradle/wrapper/gradle-wrapper.properties

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.5"
          cache: true

      - name: Installer les dépendances
        run: flutter pub get

      # Les fichiers *.g.dart / *.freezed.dart sont commités : ils doivent correspondre aux modèles.
      - name: Code généré à jour (freezed / json_serializable)
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git status --porcelain -- .
          test -z "$(git status --porcelain -- .)" || { echo "::error::Relancer build_runner et commiter le code généré"; exit 1; }

      # Le code généré (*.g.dart, *.freezed.dart) suit le format de son générateur : exclu ici.
      - name: Format du code
        run: |
          git ls-files '*.dart' | grep -vE '\.(g|freezed)\.dart$' \
            | xargs dart format --output=none --set-exit-if-changed

      - name: Analyse (flutter analyze)
        run: flutter analyze

      - name: Fichiers générés à jour (thème depuis tokens.json, icônes Lucide)
        run: >-
          flutter test test/core/theme/tokens_test.dart test/core/theme/icons_test.dart
          --plain-name "est à jour"

      - name: Tests (flutter test)
        run: flutter test

      - name: Construire l'APK release
        run: flutter build apk --release

      # Taille de l'APK dans les journaux et dans le résumé ; HTTP en clair interdit, aucune
      # sauvegarde Android, page Diagnostic absente du code compilé, icône ElecPay (plus celle de Flutter).
      - name: Vérifier l'APK release (taille, HTTP en clair, sauvegardes, Diagnostic, icône)
        run: |
          dart run tool/apk_check.dart build/app/outputs/flutter-apk/app-release.apk \
            --cleartext=false --diagnostic=absent --demo-password=absent --lucide=reduced \
            --launcher-icon=custom
          size=$(du -h build/app/outputs/flutter-apk/app-release.apk | cut -f1)
          echo "### APK release : $size (toutes architectures, non optimisé avant F10)" >> "$GITHUB_STEP_SUMMARY"

      # APK livré (F10.4, accord de Loick du 21/11/2026, option a) : un APK par architecture, code
      # obscurci, adresse https de l'API (ngrok, étape M1). En CI, signé avec la clé de DÉBOGAGE
      # (aucun secret) : Loick signe l'APK livré sur son PC avec sa clé (docs/LIVRAISON.md).
      - name: Construire les APK livrés (une par architecture, obscurcis)
        run: >-
          flutter build apk --release --split-per-abi
          --obfuscate --split-debug-info=build/symbols
          --dart-define=API_BASE_URL=https://omnivore-pardon-sixth.ngrok-free.dev

      - name: Vérifier chaque APK livré (mêmes contrôles + adresse de l'API + signature)
        run: |
          echo "### APK livrés (signés en débogage en CI)" >> "$GITHUB_STEP_SUMMARY"
          for abi in armeabi-v7a arm64-v8a x86_64; do
            apk="build/app/outputs/flutter-apk/app-$abi-release.apk"
            dart run tool/apk_check.dart "$apk" \
              --cleartext=false --diagnostic=absent --demo-password=absent --lucide=reduced \
              --launcher-icon=custom \
              --api-url=https://omnivore-pardon-sixth.ngrok-free.dev --signature=debug
            size=$(du -h "$apk" | cut -f1)
            echo "- $abi : $size" >> "$GITHUB_STEP_SUMMARY"
          done
