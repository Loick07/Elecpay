<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Utilisateurs</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/elecpay/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;family=JetBrains+Mono:wght@500&amp;display=swap">
<style>
body{margin:0}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
.bo-row:hover td{background:var(--surface-2)}
input::placeholder{color:var(--ink-faint)}
</style>
</helmet>
<div data-theme="light" style="min-height: 960px; display: flex; flex-wrap: wrap; background: var(--bg); color: var(--ink); font-family: var(--font-admin);">
<div style="flex: 1 1 232px; display: flex;"><dc-import name="Menu" active="utilisateurs" hint-size="232px,960px"></dc-import></div>

<main style="flex: 999 1 560px; min-width: 0; box-sizing: border-box; padding: 24px 32px 32px; display: flex; flex-direction: column; gap: 18px;">
<header style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 12px;">
<div><h1 style="margin: 0; font: 600 24px/32px var(--font-admin);">Utilisateurs</h1><p style="margin: 2px 0 0; font: 400 13px/20px var(--font-admin); color: var(--ink-muted);">1 284 comptes · 1 271 actifs</p></div>
<button style="min-height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink); font: 500 14px/20px var(--font-admin); cursor: pointer; display: inline-flex; align-items: center; gap: 8px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3v12M7 10l5 5 5-5M5 21h14"></path></svg>Exporter (CSV)</button>
</header>

<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 8px;">
<label style="display: flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 12px; border-radius: 10px; background: var(--surface-1); border: 1px solid var(--line); flex: 1 1 280px; max-width: 420px;"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-3.5-3.5"></path></svg><input aria-label="Rechercher un utilisateur" placeholder="Nom ou téléphone" onInput="{{search}}" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font: 400 14px/20px var(--font-admin);"></label>
<div role="tablist" aria-label="Filtrer par rôle" style="display: flex; flex-wrap: wrap; gap: 6px;">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="4"><button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button></sc-for>
</div>
</div>

<div style="border-radius: 14px; background: var(--surface-1); border: 1px solid var(--line); overflow-x: auto;">
<table style="width: 100%; border-collapse: collapse; font: 400 13px/18px var(--font-admin); font-variant-numeric: tabular-nums;">
<thead><tr>
<th style="text-align: left; padding: 12px 16px; font: 500 12px/16px var(--font-admin); color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap;">Utilisateur</th>
<th style="text-align: left; padding: 12px; font: 500 12px/16px var(--font-admin); color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap;">Rôle</th>
<th style="text-align: right; padding: 12px; font: 500 12px/16px var(--font-admin); color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap;">Foyers</th>
<th style="text-align: left; padding: 12px; font: 500 12px/16px var(--font-admin); color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap;">Factures impayées</th>
<th style="text-align: left; padding: 12px; font: 500 12px/16px var(--font-admin); color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap;">Dernière connexion</th>
<th style="text-align: left; padding: 12px 16px 12px 12px; font: 500 12px/16px var(--font-admin); color: var(--ink-muted); border-bottom: 1px solid var(--line); white-space: nowrap;">Statut</th>
</tr></thead>
<tbody>
<sc-for list="{{rows}}" as="u" hint-placeholder-count="10">
<tr class="bo-row">
<td style="padding: 10px 16px; border-bottom: 1px solid var(--line); white-space: nowrap;"><a href="Utilisateur.dc.html" style="display: flex; align-items: center; gap: 10px;"><span style="{{u.avatar}}">{{u.initials}}</span><span style="display: flex; flex-direction: column;"><span style="font: 500 14px/20px var(--font-admin);">{{u.name}}</span><span style="font: 400 12px/16px var(--font-admin); color: var(--ink-muted);">{{u.phone}}</span></span></a></td>
<td style="padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;">{{u.role}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid var(--line); text-align: right;">{{u.homes}}</td>
<td style="padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;"><span style="{{u.unpaidStyle}}">{{u.unpaid}}</span></td>
<td style="padding: 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; color: var(--ink-muted);">{{u.last}}</td>
<td style="padding: 10px 16px 10px 12px; border-bottom: 1px solid var(--line); white-space: nowrap;"><span style="{{u.statusStyle}}">{{u.status}}</span></td>
</tr>
</sc-for>
</tbody>
</table>
<sc-if value="{{empty}}" hint-placeholder-val="{{false}}"><p style="margin: 0; padding: 32px 16px; text-align: center; font: 400 14px/20px var(--font-admin); color: var(--ink-muted);">Aucun utilisateur ne correspond à cette recherche.</p></sc-if>
</div>
<div style="display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px; font: 400 13px/20px var(--font-admin); color: var(--ink-muted);">
<span>{{countText}}</span>
<div style="display: flex; gap: 6px;"><button style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink-faint); font: 500 13px/20px var(--font-admin);">Précédent</button><button style="min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink); font: 500 13px/20px var(--font-admin); cursor: pointer;">Suivant</button></div>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":960}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { role: 'tous', q: '' }; }
  renderVals() {
    const U = [
      ['Loick Makosso', '+242 06 123 45 67', 'client', 'Client', 2, '1 · 9 870 FCFA', 'warn', "Aujourd'hui 14:31", 'actif'],
      ['Grâce Ngoma', '+242 05 412 88 10', 'delegue', 'Client · payeuse déléguée', 1, '—', '', 'Hier 19:12', 'actif'],
      ['Prisca Loemba', '+242 06 778 21 45', 'client', 'Client', 1, '1 · paiement en attente', 'warn', "Aujourd'hui 14:30", 'actif'],
      ['Junior Ibara', '+242 05 301 67 92', 'client', 'Client', 1, '2 · dont 1 en retard', 'err', "Aujourd'hui 13:58", 'actif'],
      ['Arsène Massamba', '+242 06 905 33 18', 'client', 'Client', 3, '—', '', '10 nov. 08:44', 'actif'],
      ['Mireille Tchicaya', '+242 06 220 47 51', 'client', 'Client', 1, '1 · en retard de 38 j', 'err', '2 oct. 17:20', 'actif'],
      ['Bienvenu Nkounkou', '+242 05 667 10 29', 'client', 'Client', 1, '—', '', '8 nov. 10:05', 'desactive'],
      ['Patrick Moukala', '+242 06 511 02 77', 'equipe', 'Support', 0, '—', '', "Aujourd'hui 11:02", 'actif'],
      ['Christelle Mabiala', '+242 06 340 19 63', 'equipe', 'Admin', 0, '—', '', "Aujourd'hui 14:40", 'actif'],
      ['Serge Bouanga', '+242 05 128 74 36', 'equipe', 'Super admin', 0, '—', '', 'Hier 16:55', 'actif']
    ];
    const s = this.state;
    const q = s.q.trim().toLowerCase();
    const CH = [['tous', 'Tous'], ['client', 'Clients'], ['delegue', 'Payeurs délégués'], ['equipe', 'Équipe ElecPay']];
    const chips = CH.map((c) => {
      const on = c[0] === s.role;
      return { label: c[1], on: on ? 'true' : 'false', pick: () => this.setState({ role: c[0] }),
        style: 'min-height: 36px; padding: 0 12px; border-radius: 999px; cursor: pointer; font: 500 13px/20px var(--font-admin); color: var(--ink); border: 1px solid ' + (on ? 'var(--volt)' : 'var(--line)') + '; background: ' + (on ? 'var(--volt-soft)' : 'var(--surface-1)') + ';' };
    });
    const list = U.filter((u) => (s.role === 'tous' || u[2] === s.role) && (!q || u[0].toLowerCase().includes(q) || u[1].replace(/\s/g, '').includes(q.replace(/\s/g, ''))));
    const rows = list.map((u) => {
      const ini = u[0].split(' ').map((p) => p[0]).join('').slice(0, 2);
      const team = u[2] === 'equipe';
      return {
        name: u[0], phone: u[1], role: u[3], homes: team ? '—' : String(u[4]), unpaid: u[5], last: u[7], initials: ini,
        avatar: 'width: 32px; height: 32px; border-radius: 999px; flex: none; display: grid; place-items: center; font: 600 12px/16px var(--font-admin); background: ' + (team ? 'var(--volt-soft)' : 'var(--current-soft)') + '; color: ' + (team ? 'var(--volt-text)' : 'var(--current-text)') + ';',
        unpaidStyle: u[6] === 'err' ? 'color: var(--error-text); font-weight: 500;' : u[6] === 'warn' ? 'color: var(--warning); font-weight: 500;' : 'color: var(--ink-faint);',
        status: u[8] === 'actif' ? 'Actif' : 'Désactivé',
        statusStyle: 'display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 6px; font: 600 11px/14px var(--font-admin); ' + (u[8] === 'actif' ? 'background: var(--success-soft); color: var(--success);' : 'background: var(--surface-2); color: var(--ink-muted);')
      };
    });
    return {
      chips, rows, empty: rows.length === 0,
      search: (e) => this.setState({ q: e.target.value }),
      countText: rows.length + ' affiché' + (rows.length > 1 ? 's' : '') + ' · page 1 sur 129'
    };
  }
}
</script>
</body>
</html>
