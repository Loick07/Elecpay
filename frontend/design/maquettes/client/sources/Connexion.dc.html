<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Connexion</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/elecpay/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ep-screen>*{flex-shrink:0}.ep-screen{scrollbar-width:none}.ep-screen::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
input::placeholder{color:var(--ink-faint)}
</style>
</helmet>
<div class="ep-screen" style="width: 100%; height: 100vh; min-height: 560px; position: relative; overflow-x: hidden; overflow-y: auto; box-sizing: border-box; background: radial-gradient(90% 35% at 100% 0%, rgba(30,136,229,0.22), transparent 70%), var(--bg); color: var(--ink); font-family: var(--font-app); display: flex; flex-direction: column; padding: 0 16px;">

<div style="margin-top: 72px; display: flex; align-items: center; gap: 10px;">
<span style="width: 40px; height: 40px; border-radius: 12px; background: var(--volt); color: var(--on-volt); display: grid; place-items: center;"><svg width="22" height="22" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="1" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></span>
<span style="font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -0.02em;">ElecPay</span>
</div>

<h1 style="margin: 40px 0 0; font-size: 28px; line-height: 36px; font-weight: 600; letter-spacing: -0.01em;">Connexion</h1>
<p style="margin: 6px 0 0; font-size: 15px; line-height: 22px; color: var(--ink-muted);">Connectez-vous avec votre numéro de téléphone.</p>

<form style="margin-top: 32px; display: flex; flex-direction: column; gap: 18px;">
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="tel" style="font: 500 13px/20px var(--font-app); color: var(--ink-muted);">Numéro de téléphone</label>
<div style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: var(--surface-1); border: 1px solid var(--line);">
<span style="color: var(--ink-muted); padding-right: 8px; border-right: 1px solid var(--line); font: 400 15px/22px var(--font-app);">+242</span>
<input id="tel" type="tel" autocomplete="tel" value="06 123 45 67" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font: 400 15px/22px var(--font-app); font-variant-numeric: tabular-nums;">
</div>
</div>
<div style="display: flex; flex-direction: column; gap: 6px;">
<label for="mdp" style="font: 500 13px/20px var(--font-app); color: var(--ink-muted);">Mot de passe</label>
<div style="display: flex; align-items: center; gap: 8px; min-height: 52px; padding: 0 6px 0 16px; border-radius: 14px; background: var(--surface-1); border: 1px solid var(--current); box-shadow: 0 0 0 3px var(--current-soft);">
<input id="mdp" type="{{pwType}}" autocomplete="current-password" value="elecpay2026" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; color: var(--ink); font: 400 15px/22px var(--font-app);">
<button type="button" onClick="{{toggle}}" aria-label="{{toggleLabel}}" style="width: 44px; height: 44px; border: none; border-radius: 12px; background: transparent; color: var(--ink-muted); display: grid; place-items: center; cursor: pointer;">
<sc-if value="{{shown}}" hint-placeholder-val="{{false}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 3l18 18M10.6 6.1A9.8 9.8 0 0112 6c5 0 9 6 9 6a17 17 0 01-2.6 3.2M6.6 6.6C4.3 8.2 3 12 3 12s4 6 9 6a9 9 0 004.4-1.1M9.9 9.9a3 3 0 004.2 4.2"></path></svg></sc-if>
<sc-if value="{{hidden}}" hint-placeholder-val="{{true}}"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12z"></path><circle cx="12" cy="12" r="3"></circle></svg></sc-if>
</button>
</div>
<a href="MotDePasse.dc.html" style="align-self: flex-end; display: inline-flex; align-items: center; min-height: 44px; font: 500 14px/20px var(--font-app); color: var(--volt-text);">Mot de passe oublié ?</a>
</div>
<a href="Main.dc.html" style="display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: var(--volt); color: var(--on-volt); font: 600 15px/22px var(--font-app);">Se connecter</a>
</form>

<div style="margin-top: auto; margin-bottom: 36px; display: flex; flex-direction: column; align-items: center; gap: 16px;">
<p style="margin: 0; font: 400 14px/20px var(--font-app); color: var(--ink-muted);">Pas encore de compte ?</p>
<a href="Inscription.dc.html" style="width: 100%; box-sizing: border-box; display: inline-flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; border: 1px solid var(--glass-border); background: var(--glass); color: var(--ink); font: 500 15px/22px var(--font-app);">Créer un compte</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { shown: false }; }
  renderVals() {
    const shown = this.state.shown;
    return {
      shown, hidden: !shown,
      pwType: shown ? 'text' : 'password',
      toggleLabel: shown ? 'Masquer le mot de passe' : 'Afficher le mot de passe',
      toggle: () => this.setState({ shown: !shown })
    };
  }
}
</script>
</body>
</html>
