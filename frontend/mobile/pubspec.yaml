name: elecpay
description: "ElecPay : suivi de consommation, factures E2C et paiement Mobile Money."
publish_to: 'none' # application, jamais publiée comme paquet

# version (versionName Android) + numéro de build (versionCode)
version: 1.0.0+1

environment:
  sdk: ^3.13.4

# Versions FIXÉES (comme requirements.txt du backend) : même résultat sur toutes les machines.
# Mettre à jour volontairement : `flutter pub outdated`, puis modifier ici et relancer les tests.
dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: 3.5.0      # état et dépendances
  go_router: 18.1.4            # navigation (barre du bas, écrans poussés)
  dio: 5.11.1                  # appels à l'API ElecPay
  freezed_annotation: 3.1.0    # modèles de données immuables (écrits à la main)
  json_annotation: 4.12.0
  flutter_secure_storage: 11.2.0  # jetons de connexion (Keystore Android)
  fl_chart: 1.3.1              # graphiques de consommation
  intl: 0.20.3                 # formats français (dates, nombres)
  flutter_animate: 4.5.2       # animations de la charte
  skeletonizer: 3.0.0          # squelettes de chargement
  path_provider: 2.1.6         # dossier privé de l'application (cache hors ligne)
  # Pas de google_fonts : la police Poppins est EMBARQUÉE (assets/fonts), hors ligne et sans
  # téléchargement au premier lancement (décision de Loick, 15/11/2026).
  # Pas de paquet d'icônes : la police Lucide est EMBARQUÉE (assets/fonts/Lucide.ttf), réduite par
  # Flutter aux seules icônes utilisées (décision de Loick, 17/11/2026).

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 6.0.0
  build_runner: 2.17.1         # génération du code freezed / json_serializable
  freezed: 4.0.3
  json_serializable: 6.15.2
  dart_style: 3.1.14           # met en forme le code généré depuis tokens.json (outil maison)
  archive: 4.7.1               # lecture de l'APK par tool/apk_check.dart (outil, pas l'application)

flutter:
  uses-material-design: true
  # Polices EMBARQUÉES (licence SIL OFL 1.1, fichiers OFL-*.txt) : Poppins pour l'application,
  # JetBrains Mono pour les références (facture, transaction, reçu, compteur).
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
          weight: 400
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono.ttf # police variable (graisse réglée par le style)
    # Icônes au trait (lucide-static 1.73.0, licence ISC + MIT pour les icônes issues de Feather).
    # Codes générés par tool/generate_icons.dart dans lib/core/theme/lucide_icons.g.dart.
    - family: Lucide
      fonts:
        - asset: assets/fonts/Lucide.ttf

  # Licences des polices embarquées : affichées dans l'écran des licences de l'application
  # (enregistrées au démarrage par lib/app/licenses.dart).
  assets:
    - assets/fonts/LICENSE-Lucide.txt
    - assets/fonts/OFL-Poppins.txt
    - assets/fonts/OFL-JetBrainsMono.txt
