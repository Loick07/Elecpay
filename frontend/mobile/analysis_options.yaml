# Règles d'analyse de l'application ElecPay : `flutter analyze` doit rester sans remarque.
include: package:flutter_lints/flutter.yaml

formatter:
  page_width: 100 # comme le backend (Ruff)

analyzer:
  exclude:
    - build/**
    - android/**
    - "**/*.g.dart"       # code généré (json_serializable)
    - "**/*.freezed.dart" # code généré (freezed)
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Un oubli de ces règles est une vraie erreur, pas un simple avertissement.
    missing_required_param: error
    missing_return: error
    must_be_immutable: error

linter:
  rules:
    - always_declare_return_types
    - avoid_dynamic_calls
    - avoid_print                   # journaux : jamais print (données personnelles)
    - avoid_slow_async_io
    - avoid_type_to_string
    - cancel_subscriptions
    - close_sinks
    - directives_ordering
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_fields
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - unawaited_futures
    - unnecessary_lambdas
    - use_build_context_synchronously
    - use_super_parameters
