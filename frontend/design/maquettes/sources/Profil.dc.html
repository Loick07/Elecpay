<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Compte</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="ds/elecpay/tokens.css">
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
.ep-screen>*{flex-shrink:0}.ep-screen{scrollbar-width:none}.ep-screen::-webkit-scrollbar{display:none}
a{color:inherit;text-decoration:none}a:hover{color:inherit}
</style>
</helmet>
<div class="ep-screen" style="width: 100%; height: 100vh; min-height: 560px; position: relative; overflow-x: hidden; overflow-y: auto; box-sizing: border-box; background: var(--bg); color: var(--ink); font-family: var(--font-app); display: flex; flex-direction: column;">

<header style="padding: 20px 16px 0; display: flex; align-items: center; gap: 14px;">
<span style="width: 56px; height: 56px; border-radius: 999px; background: var(--current-soft); color: var(--current-text); display: grid; place-items: center; font: 600 19px/24px var(--font-app); flex: none;">LM</span>
<div style="flex: 1; min-width: 0; display: flex; flex-direction: column;">
<span style="font: 600 20px/28px var(--font-app);">Loick Makosso</span>
<span style="font: 400 13px/20px var(--font-app); color: var(--ink-muted); font-variant-numeric: tabular-nums;">+242 06 123 45 67</span>
</div>
<button style="min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1px solid var(--line); background: var(--surface-1); color: var(--ink); font: 500 13px/20px var(--font-app); cursor: pointer;">Modifier</button>
</header>

<div style="margin: 18px 16px 0; display: flex; flex-direction: column; gap: 14px;">

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);">Mon compte</span>
<div style="border-radius: 20px; background: var(--surface-1); overflow: hidden;">
<a href="Compteurs.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="3" width="16" height="18" rx="2"></rect><path d="M8 8h8M8 12h3"></path></svg>
<span style="flex: 1; font: 400 15px/22px var(--font-app);">Compteurs et foyers</span><span style="font: 400 13px/20px var(--font-app); color: var(--ink-muted);">2 foyers</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="Historique.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid var(--line);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 2h12v20l-3-2-3 2-3-2-3 2z"></path><path d="M9 7h6M9 11h6M9 15h4"></path></svg>
<span style="flex: 1; font: 400 15px/22px var(--font-app);">Paiements et reçus</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="MotDePasse.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid var(--line);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="5" y="11" width="14" height="10" rx="2"></rect><path d="M8 11V7a4 4 0 018 0v4"></path></svg>
<span style="flex: 1; font: 400 15px/22px var(--font-app);">Mot de passe et sécurité</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);">Me prévenir</span>
<div style="border-radius: 20px; background: var(--surface-1); overflow: hidden;">
<sc-for list="{{toggles}}" as="t" hint-placeholder-count="3">
<button role="switch" aria-checked="{{t.on}}" onClick="{{t.flip}}" style="{{t.rowStyle}}">
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column; text-align: left;"><span style="font: 400 15px/22px var(--font-app); color: var(--ink);">{{t.label}}</span><span style="font: 400 12px/16px var(--font-app); color: var(--ink-muted);">{{t.sub}}</span></span>
<span style="{{t.track}}"><span style="{{t.knob}}"></span></span>
</button>
</sc-for>
</div>
</div>

<div style="display: flex; flex-direction: column; gap: 6px;">
<span style="font-size: 11px; line-height: 14px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: var(--ink-muted);">Affichage</span>
<div style="border-radius: 20px; background: var(--surface-1); padding: 10px 16px; display: flex; align-items: center; justify-content: space-between; gap: 12px;">
<span style="font: 400 15px/22px var(--font-app);">Thème</span>
<div role="radiogroup" aria-label="Thème" style="display: inline-flex; gap: 4px; padding: 4px; border-radius: 12px; background: var(--surface-2);">
<sc-for list="{{themes}}" as="th" hint-placeholder-count="3">
<button role="radio" aria-checked="{{th.on}}" onClick="{{th.pick}}" style="{{th.style}}">{{th.label}}</button>
</sc-for>
</div>
</div>
</div>

<div style="border-radius: 20px; background: var(--surface-1); overflow: hidden;">
<a href="Assistance.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px;">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="var(--ink-muted)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"></path></svg>
<span style="flex: 1; font: 400 15px/22px var(--font-app);">Assistance</span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="var(--ink-faint)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<a href="Connexion.dc.html" style="display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-top: 1px solid var(--line); color: var(--error-text);">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 3h4a1 1 0 011 1v16a1 1 0 01-1 1h-4M10 17l-5-5 5-5M5 12h11"></path></svg>
<span style="flex: 1; font: 500 15px/22px var(--font-app);">Se déconnecter</span>
</a>
</div>
<span style="text-align: center; font: 400 12px/16px var(--font-app); color: var(--ink-faint);">ElecPay 1.0.0 · Mode démo</span>
</div>

<nav aria-label="Navigation principale" style="position: sticky; bottom: 12px; margin: auto 12px 12px; z-index: 5; display: flex; align-items: flex-end; justify-content: space-around; padding: 8px 8px 10px; border-radius: 28px; background: var(--glass-strong); border: 1px solid var(--glass-border); backdrop-filter: blur(24px); -webkit-backdrop-filter: blur(24px); box-shadow: var(--shadow-float);">
<a href="Main.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 48px; justify-content: center; font: 500 11px/14px var(--font-app); color: var(--ink-muted);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 10l9-7 9 7v10a1 1 0 01-1 1h-5v-6H9v6H4a1 1 0 01-1-1z"></path></svg>Accueil</a>
<a href="Factures.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 48px; justify-content: center; font: 500 11px/14px var(--font-app); color: var(--ink-muted);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 3H6a1 1 0 00-1 1v16a1 1 0 001 1h12a1 1 0 001-1V8z"></path><path d="M14 3v5h5M9 13h6M9 17h4"></path></svg>Factures</a>
<a href="Paiement.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 0; min-width: 64px; font: 600 11px/14px var(--font-app); color: var(--volt-text);"><span style="width: 56px; height: 56px; border-radius: 999px; background: var(--volt); color: var(--on-volt); display: grid; place-items: center; box-shadow: var(--shadow-volt); margin-top: -26px; margin-bottom: 4px;"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="6" width="18" height="13" rx="2"></rect><path d="M3 10h18M16 15h2"></path></svg></span>Payer</a>
<a href="Consommation.dc.html" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 48px; justify-content: center; font: 500 11px/14px var(--font-app); color: var(--ink-muted);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg>Conso</a>
<a href="Profil.dc.html" aria-current="page" style="display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 56px; min-height: 48px; justify-content: center; font: 600 11px/14px var(--font-app); color: var(--ink);"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21a8 8 0 0116 0"></path></svg>Compte<span style="width: 4px; height: 4px; border-radius: 999px; background: var(--volt);"></span></a>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { ech: true, pay: true, conso: false, theme: 'nuit' }; }
  renderVals() {
    const s = this.state;
    const T = [['ech', 'Échéances', '5 jours avant, puis le jour même'], ['pay', 'Paiements', 'Réussis, échoués, reçus disponibles'], ['conso', 'Consommation inhabituelle', 'Quand un jour dépasse votre moyenne de 30 %']];
    const toggles = T.map(([k, label, sub], i) => {
      const on = !!s[k];
      return {
        label, sub, on: on ? 'true' : 'false',
        flip: () => this.setState({ [k]: !on }),
        rowStyle: 'display: flex; align-items: center; gap: 12px; width: 100%; min-height: 60px; padding: 8px 16px; border: none; background: transparent; cursor: pointer; font-family: var(--font-app);' + (i ? ' border-top: 1px solid var(--line);' : ''),
        track: 'flex: none; width: 48px; height: 28px; border-radius: 999px; position: relative; transition: background 150ms ease-out; background: ' + (on ? 'var(--volt)' : 'var(--surface-3)') + ';',
        knob: 'position: absolute; top: 3px; left: ' + (on ? '23px' : '3px') + '; width: 22px; height: 22px; border-radius: 999px; background: ' + (on ? 'var(--on-volt)' : 'var(--ink-muted)') + '; transition: left 150ms ease-out;'
      };
    });
    const themes = [['nuit', 'Nuit'], ['jour', 'Jour'], ['auto', 'Auto']].map(([id, label]) => {
      const on = s.theme === id;
      return { label, on: on ? 'true' : 'false', pick: () => this.setState({ theme: id }),
        style: 'min-height: 32px; padding: 0 12px; border: none; border-radius: 9px; cursor: pointer; font: ' + (on ? '600' : '500') + ' 13px/20px var(--font-app); color: ' + (on ? 'var(--ink)' : 'var(--ink-muted)') + '; background: ' + (on ? 'var(--surface-1)' : 'transparent') + ';' + (on ? ' box-shadow: var(--shadow-card);' : '') };
    });
    return { toggles, themes };
  }
}
</script>
</body>
</html>
