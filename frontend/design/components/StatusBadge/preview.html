<!doctype html>
<html lang="fr">
<head><meta charset="utf-8"><title>Badges de statut</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="stylesheet" href="../../tokens.css"><link rel="stylesheet" href="../../components.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500&display=swap">
<style>html,body{margin:0;background:var(--bg)} .pv{padding:16px;display:flex;flex-direction:column;gap:16px} </style>
</head>
<body class="ep-root">
<div class="pv">

<div><div class="ep-overline" style="margin-bottom:8px">Facture</div><div class="ep-row"><span class="ep-badge ep-badge--info"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>À payer</span><span class="ep-badge ep-badge--warning"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v3a5 5 0 005 5 5 5 0 015 5v5M17 3v3a5 5 0 01-5 5 5 5 0 00-5 5v5"/></svg>Paiement en cours</span><span class="ep-badge ep-badge--success"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Payée</span><span class="ep-badge ep-badge--error"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M10.3 3.9L2.4 18a2 2 0 001.7 3h15.8a2 2 0 001.7-3L13.7 3.9a2 2 0 00-3.4 0z"/><path d="M12 9v4M12 17h.01"/></svg>En retard</span><span class="ep-badge ep-badge--neutral"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M5.6 5.6l12.8 12.8"/></svg>Annulée</span></div></div>
<div><div class="ep-overline" style="margin-bottom:8px">Transaction</div><div class="ep-row"><span class="ep-badge ep-badge--warning"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3h12M6 21h12M7 3v3a5 5 0 005 5 5 5 0 015 5v5M17 3v3a5 5 0 01-5 5 5 5 0 00-5 5v5"/></svg>En attente</span><span class="ep-badge ep-badge--success"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12l5 5L20 7"/></svg>Réussie</span><span class="ep-badge ep-badge--error"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>Échouée</span><span class="ep-badge ep-badge--neutral"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>Expirée</span><span class="ep-badge ep-badge--warning"><svg class="ep-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 015 .5c0 1.5-2.5 2-2.5 3.5M12 17h.01"/></svg>Vérification en cours</span></div></div>
</div>
</body>
</html>
