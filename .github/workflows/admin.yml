# Intégration continue du back-office Next.js (frontend/admin/).
# Lancée quand le back-office change, ou la charte dont son thème est généré (tokens.json), ou le
# contrat d'API dont ses types sont générés (openapi.json) : décision DA0.8 de frontend/admin/DECOUPAGES.md.
name: Admin

on:
  push:
    branches: [main]
    paths:
      - "frontend/admin/**"
      - "frontend/design/tokens.json"
      - "backend/openapi.json"
      - ".github/workflows/admin.yml"
  pull_request:
    paths:
      - "frontend/admin/**"
      - "frontend/design/tokens.json"
      - "backend/openapi.json"
      - ".github/workflows/admin.yml"
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend/admin

    env:
      NEXT_TELEMETRY_DISABLED: "1" # aucune statistique envoyée à Vercel depuis la CI
      # Adresse TÉMOIN de l'API : le contrôle du code du navigateur vérifie qu'elle n'y apparaît pas
      # (le relais, côté serveur, est seul à la connaître). Domaine `.invalid` : jamais joignable.
      ELECPAY_API_URL: https://api-sentinelle.invalid

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/admin/.nvmrc
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Dépendances (versions exactes du package-lock.json)
        run: npm ci

      - name: Lint (règles Next, accessibilité stricte)
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Format (Prettier)
        run: npm run format:check

      - name: Tests unitaires et de composants
        run: npm test

      - name: Construction de production
        run: npm run build

      - name: Rien de sensible dans le code envoyé au navigateur
        run: npm run check:bundle

      - name: En-têtes de sécurité sur le serveur de production
        run: |
          npx next start --port 3010 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://localhost:3010/ && break; sleep 1; done
          npm run check:headers -- http://localhost:3010

      - name: Failles connues des dépendances de production
        run: npm audit --omit=dev --audit-level=high
