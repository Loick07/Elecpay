# Intégration continue du back-office Next.js (frontend/admin/).
# Lancée quand le back-office change, ou la charte dont son thème est généré (tokens.json), ou le
# contrat d'API dont ses types sont générés (openapi.json), ou les erreurs d'authentification du
# backend que la session classe (errors.py, test session-codes) : décision DA0.8 de DECOUPAGES.md.
name: Admin

on:
  push:
    branches: [main]
    paths:
      - "frontend/admin/**"
      - "frontend/design/tokens.json"
      - "backend/openapi.json"
      - "backend/app/modules/auth/errors.py"
      - ".github/workflows/admin.yml"
  pull_request:
    paths:
      - "frontend/admin/**"
      - "frontend/design/tokens.json"
      - "backend/openapi.json"
      - "backend/app/modules/auth/errors.py"
      - ".github/workflows/admin.yml"
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

concurrency:
  group: admin-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check-build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    defaults:
      run:
        working-directory: frontend/admin

    env:
      NEXT_TELEMETRY_DISABLED: "1" # aucune statistique envoyée à Vercel depuis la CI
      # Adresse TÉMOIN de l'API : le contrôle du code du navigateur vérifie qu'elle n'y apparaît pas
      # (le relais, côté serveur, est seul à la connaître). Domaine `.invalid` : jamais joignable.
      ELECPAY_API_URL: https://api-sentinelle.invalid

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/admin/.nvmrc
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Dépendances (versions exactes du package-lock.json)
        run: npm ci

      - name: Lint (règles Next, accessibilité stricte)
        run: npm run lint

      - name: Types
        run: npm run typecheck

      - name: Format (Prettier)
        run: npm run format:check

      - name: Tests unitaires et de composants
        run: npm test

      - name: Construction de production
        run: npm run build

      - name: Rien de sensible dans le code envoyé au navigateur
        run: npm run check:bundle

      - name: En-têtes de sécurité sur le serveur de production
        run: |
          npm start -- --port 3010 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3010/ && break; sleep 1; done
          npm run check:headers -- http://127.0.0.1:3010

      - name: Failles connues des dépendances de production
        run: npm audit --omit=dev --audit-level=high

  e2e:
    # Parcours de bout en bout (DA0.9), les mêmes que tool/e2e.ps1 en local : MySQL neuf (base
    # elecpay_admin_e2e), API de test (port 8010, jetons d'accès d'une minute), back-office construit
    # (next start, port 3010, CSP stricte), Playwright (Chromium) avec axe.
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: elecpay_admin_e2e
          MYSQL_USER: elecpay
          MYSQL_PASSWORD: elecpay
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uelecpay -pelecpay --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    # Pas de fichier .env en CI : la configuration passe par les variables d'environnement.
    env:
      DATABASE_URL: mysql+pymysql://elecpay:elecpay@127.0.0.1:3306/elecpay_admin_e2e?charset=utf8mb4
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PAYMENT_PROVIDER: simulated
      PAYMENT_WEBHOOK_SECRET: ci-only-webhook-secret-not-used-anywhere-else
      BILLING_SOURCE: simulated
      DEMO_MODE: "true"
      ACCESS_TOKEN_MINUTES: "1"
      ELECPAY_API_URL: http://127.0.0.1:8010
      ELECPAY_E2E_DATABASE: elecpay_admin_e2e
      NEXT_TELEMETRY_DISABLED: "1"

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: API de test (dépendances)
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # Équivalent de --log-bin-trust-function-creators=1 du docker-compose (voir backend.yml).
      - name: Autoriser les triggers MySQL
        run: >-
          python -c "import pymysql;
          c = pymysql.connect(host='127.0.0.1', user='root', password='root');
          c.cursor().execute('SET GLOBAL log_bin_trust_function_creators = 1')"

      - name: Base de test (migrations, données de démo)
        working-directory: backend
        run: |
          alembic upgrade head
          python -m scripts.seed > /dev/null

      - name: API de test (port 8010)
        working-directory: backend
        run: |
          nohup uvicorn app.main:app --host 127.0.0.1 --port 8010 > "$RUNNER_TEMP/api.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:8010/api/v1/health && break; sleep 1; done
          curl -sf http://127.0.0.1:8010/api/v1/health

      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/admin/.nvmrc
          cache: npm
          cache-dependency-path: frontend/admin/package-lock.json

      - name: Back-office (dépendances, construction)
        working-directory: frontend/admin
        run: |
          npm ci
          npm run build

      - name: Back-office (next start, port 3010)
        working-directory: frontend/admin
        run: |
          nohup npm start -- --port 3010 > "$RUNNER_TEMP/site.log" 2>&1 &
          for i in $(seq 1 30); do curl -sf -o /dev/null http://127.0.0.1:3010/connexion && break; sleep 1; done
          curl -sf -o /dev/null http://127.0.0.1:3010/connexion

      - name: Navigateur (Chromium de Playwright)
        working-directory: frontend/admin
        run: npx playwright install --with-deps chromium

      - name: Parcours de bout en bout
        working-directory: frontend/admin
        run: npx playwright test

      - name: Rapport, traces et journaux (en cas d'échec)
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-rapport
          path: |
            frontend/admin/build/e2e/
            ${{ runner.temp }}/api.log
            ${{ runner.temp }}/site.log
          retention-days: 7
