# Intégration continue du backend : Ruff + tests sur une vraie base MySQL 8.4.
name: Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch: # lancement manuel depuis l'onglet Actions

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: elecpay_test
          MYSQL_USER: elecpay
          MYSQL_PASSWORD: elecpay
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uelecpay -pelecpay --silent"
          --health-interval=5s
          --health-timeout=3s
          --health-retries=20

    # Pas de fichier .env en CI : la configuration passe par les variables d'environnement.
    env:
      APP_ENV: test
      DATABASE_URL: mysql+pymysql://elecpay:elecpay@127.0.0.1:3306/elecpay_test?charset=utf8mb4
      TEST_DATABASE_URL: mysql+pymysql://elecpay:elecpay@127.0.0.1:3306/elecpay_test?charset=utf8mb4
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
      PAYMENT_PROVIDER: simulated
      BILLING_SOURCE: simulated
      DEMO_MODE: "true"
      CORS_ORIGINS: http://localhost:3000

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
          pip check

      - name: Ruff (lint)
        run: ruff check --output-format=github .

      - name: Ruff (format)
        run: ruff format --check .

      # Équivalent de --log-bin-trust-function-creators=1 du docker-compose (les services
      # GitHub n'acceptent pas d'options de démarrage) : permet à `elecpay` de créer des triggers.
      - name: Autoriser les triggers MySQL
        run: >-
          python -c "import pymysql;
          c = pymysql.connect(host='127.0.0.1', user='root', password='root');
          c.cursor().execute('SET GLOBAL log_bin_trust_function_creators = 1')"

      - name: Migrations (upgrade / check / downgrade)
        run: |
          alembic upgrade head
          alembic check
          alembic downgrade base

      - name: Tests
        run: pytest
